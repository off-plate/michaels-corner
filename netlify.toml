# Static site: HTML lives at the repo root, no build step.
[build]
  publish = "."
  command = ""

# app.js is shared and cached across all 8 pages; a short cache keeps it fresh
# within an hour of a future deploy without re-fetching on every navigation.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# llms.txt and llms-full.txt are plain text and must not be served as HTML.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "index"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "index"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
